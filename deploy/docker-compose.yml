services:
  addon:
    build: ..
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      ADMIN_TOKEN: ${ADMIN_TOKEN:?define ADMIN_TOKEN en el fichero .env}
    volumes:
      - addon-data:/app/data
    expose:
      - "7010"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN en el fichero .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - addon

volumes:
  addon-data:
  caddy-data:
  caddy-config:
