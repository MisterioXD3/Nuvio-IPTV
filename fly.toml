app = "nuvio-iptv-addon"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/app/data"
  PORT = "7010"

[[mounts]]
  source = "nuvio_iptv_data"
  destination = "/app/data"

[http_service]
  internal_port = 7010
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    Access-Control-Allow-Origin = "*"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
